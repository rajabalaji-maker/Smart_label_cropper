publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  syncfusion_flutter_pdf: ^26.1.42
  pdf: ^3.10.8
  printing: ^5.13.2
  file_picker: ^8.0.0
  share_plus: ^9.0.0
  intl: ^0.19.0
