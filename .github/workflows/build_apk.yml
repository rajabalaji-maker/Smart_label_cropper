name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (Pinned LTS 3.24.5)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Configure Android Project
        run: |
          rm -rf android
          flutter create temp_proj --project-name=tony_max_mobile --platforms=android --org=com.tonymax
          mv temp_proj/android .
          rm -rf temp_proj
          mkdir -p assets
          # Set minSdk to 21 and compileSdk to 35
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.compileSdkVersion=35" >> android/local.properties
          find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i -E 's/minSdk(Version)?[[:space:]=]+flutter\.minSdkVersion/minSdkVersion 21/g' {} + 2>/dev/null || true
          find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i -E 's/compileSdk(Version)?[[:space:]=]+flutter\.compileSdkVersion/compileSdkVersion 35/g' {} + 2>/dev/null || true
          sed -i 's/android:label="tony_max_mobile"/android:label="Tony Max Orders"/g' android/app/src/main/AndroidManifest.xml 2>/dev/null || true

          # Add Google Maven mirror to prevent 403 Forbidden rate limits
          find android -type f \( -name "build.gradle" -o -name "settings.gradle" \) -exec sed -i 's|mavenCentral()|maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }\n        mavenCentral()|g' {} + 2>/dev/null || true
          find android -type f \( -name "build.gradle.kts" -o -name "settings.gradle.kts" \) -exec sed -i 's|mavenCentral()|maven("https://maven-central.storage-download.googleapis.com/maven2/")\n        mavenCentral()|g' {} + 2>/dev/null || true

          # Pin printing to 5.13.1 for clean web/share_plus dependency resolution
          sed -i 's/printing: .*/printing: 5.13.1/g' pubspec.yaml

          # Disable verifyReleaseResources to prevent AAPT lStar error
          if [ -f android/build.gradle ]; then
            printf '\nallprojects {\n    tasks.configureEach { task ->\n        if (task.name.contains("verifyReleaseResources") || task.name.contains("VerifyLibraryResources")) {\n            task.enabled = false\n        }\n    }\n}\n' >> android/build.gradle
          fi
          if [ -f android/build.gradle.kts ]; then
            printf '\nallprojects {\n    tasks.configureEach {\n        if (name.contains("verifyReleaseResources", ignoreCase = true) || name.contains("VerifyLibraryResources", ignoreCase = true)) {\n            setEnabled(false)\n        }\n    }\n}\n' >> android/build.gradle.kts
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TonyMax-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
