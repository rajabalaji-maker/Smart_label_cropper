name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configure Android Project
        run: |
          rm -rf android
          flutter create temp_proj --project-name=tony_max_mobile --platforms=android --org=com.tonymax
          mv temp_proj/android .
          rm -rf temp_proj
          mkdir -p assets
          # Set minSdk to 21 for modern plugins (file_picker & printing)
          echo "flutter.minSdkVersion=21" >> android/local.properties
          find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i -E 's/minSdk(Version)?[[:space:]=]+flutter\.minSdkVersion/minSdk = 21/g' {} + 2>/dev/null || true
          find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i -E 's/minSdkVersion[[:space:]]+flutter\.minSdkVersion/minSdkVersion 21/g' {} + 2>/dev/null || true
          sed -i 's/android:label="tony_max_mobile"/android:label="Tony Max Orders"/g' android/app/src/main/AndroidManifest.xml 2>/dev/null || true

          # Bypass AAR metadata compileSdk checks for older plugins (like file_picker)
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          echo "android.dependency.enforceCompileSdk=false" >> android/gradle.properties
          if [ -f android/build.gradle.kts ]; then
            printf "\nallprojects {\n    tasks.configureEach {\n        if (name.contains(\"AarMetadata\", ignoreCase = true)) {\n            setEnabled(false)\n        }\n    }\n}\n" >> android/build.gradle.kts
          fi
          if [ -f android/build.gradle ]; then
            printf "\nallprojects {\n    tasks.configureEach { task ->\n        if (task.name.contains(\"AarMetadata\")) {\n            task.enabled = false\n        }\n    }\n}\n" >> android/build.gradle
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TonyMax-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
